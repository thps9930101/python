[worker]
dispatcher_host = 127.0.0.1
dispatcher_port = 9000

; 留空就自動產生，例如 worker-a1b2c3d4
worker_id =

; 一台工作站同時最多處理幾筆
max_parallel_jobs = 2

; 幾秒送一次 heartbeat 給分配機
worker_heartbeat_interval = 10

; 下載 / 上傳 timeout（秒）
download_timeout = 600
upload_timeout = 600

; ffmpeg 執行檔
; Windows 可改成 C:\ffmpeg\bin\ffmpeg.exe
ffmpeg_path = ffmpeg

; put_binary / post_file
upload_mode = put_binary

; 如果 upload_mode=post_file，表單欄位名稱用這個
upload_field = file

connect_timeout = 10
reconnect_interval = 5